{% if messages %}
<div class="messages-container position-fixed top-0 end-0 p-3" style="z-index: 1050; margin-top: 56px;">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}
                alert-dismissible fade show shadow-sm mb-2" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
