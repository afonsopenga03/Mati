{% extends 'saas_admin/base_saas.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold">Criar Novo Plano</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nome do Plano</label>
                        <input type="text" name="name" class="form-control" placeholder="Ex: Enterprise Pro" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Preço Mensal (Kz)</label>
                            <input type="number" name="price" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ciclo de Cobrança</label>
                            <select name="billing_cycle" class="form-select">
                                <option value="monthly">Mensal</option>
                                <option value="yearly">Anual</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Máx. Usuários</label>
                            <input type="number" name="max_users" class="form-control" value="10">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Máx. Medidores</label>
                            <input type="number" name="max_meters" class="form-control" value="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Trial (dias)</label>
                            <input type="number" name="trial_days" class="form-control" value="14">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                        <label class="form-check-label" for="isActive">Ativar plano imediatamente</label>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'saas_admin:plans_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Criar Plano</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
